<!DOCTYPE html>
<html>

<head>

    <title>Movie Recommendation System</title>

    <link rel="stylesheet"
    href="{{ url_for('static',filename='style.css') }}">

</head>

<body>

<div class="container">

<h1>🎬 Movie Recommendation System</h1>

<form action="/recommend" method="POST">

<select name="movie">

{% for movie in movies %}

<option value="{{movie}}">

{{movie}}

</option>

{% endfor %}

</select>

<br><br>

<input type="submit" value="Recommend Movies">

</form>

</div>

</body>

</html>
